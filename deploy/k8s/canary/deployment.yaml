apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag-api-canary
  namespace: prod
  labels:
    app: enterprise-rag-api
    track: canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-rag-api
      track: canary
  template:
    metadata:
      labels:
        app: enterprise-rag-api
        track: canary
        version: canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/alakhdeepsingh/enterprise-rag-api:canary
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: ENV
              value: "canary"
            - name: LOG_LEVEL
              value: "DEBUG"
